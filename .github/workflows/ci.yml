name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible-core }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - '2.16'
          - '2.17'
          - '2.18'
        python:
          - '3.10'
          - '3.11'
          - '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ansible_collections/redhat/argocd

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible-core }}
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${{ matrix.ansible-core }}.*"

      - name: Run ansible-test sanity
        working-directory: ansible_collections/redhat/argocd
        run: |
          ansible-test sanity --docker -v --color --python ${{ matrix.python }}

  units:
    name: Unit Tests (ansible-core ${{ matrix.ansible-core }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - '2.16'
          - '2.17'
          - '2.18'
        python:
          - '3.10'
          - '3.11'
          - '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ansible_collections/redhat/argocd

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible-core }}
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${{ matrix.ansible-core }}.*"

      - name: Run ansible-test units
        working-directory: ansible_collections/redhat/argocd
        run: |
          ansible-test units --docker -v --color --python ${{ matrix.python }}

  integration:
    name: Integration Tests (ansible-core ${{ matrix.ansible-core }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs:
      - sanity
      - units
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - '2.16'
          - '2.17'
          - '2.18'
        python:
          - '3.10'
          - '3.11'
          - '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ansible_collections/redhat/argocd

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core ${{ matrix.ansible-core }}
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${{ matrix.ansible-core }}.*"

      - name: Run ansible-test integration
        working-directory: ansible_collections/redhat/argocd
        run: |
          ansible-test integration --docker -v --color --python ${{ matrix.python }}
